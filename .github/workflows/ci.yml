name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test seams
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Both seams — the Runner CLI against the fake Codex binary, and the asset lint.
      # No dependencies, so no install step.
      - run: npm test
